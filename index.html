<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Foryesify</title>
  <style>
    :root {
      color-scheme: light dark;
      --fg: #1f2328;
      --fg-muted: #59636e;
      --accent: #0969da;
      --accent-hover: #0550ae;
      --canvas: #ffffff;
      --canvas-subtle: #f6f8fa;
      --border: #d1d9e0;
      --border-muted: #d1d9e0b3;
      --shadow: #1f23280a;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #e6edf3;
        --fg-muted: #9198a1;
        --accent: #4493f8;
        --accent-hover: #79b8ff;
        --canvas: #0d1117;
        --canvas-subtle: #151b23;
        --border: #3d444d;
        --border-muted: #3d444db3;
        --shadow: #01040966;
      }
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      color: var(--fg);
      background: var(--canvas-subtle);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
      font-size: 16px;
      line-height: 1.5;
    }

    .page {
      max-width: 1012px;
      margin: 0 auto;
      padding: 16px;
    }

    @media (min-width: 768px) {
      .page { padding: 24px 32px 40px; }
    }

    .file {
      overflow: hidden;
      background: var(--canvas);
      border: 1px solid var(--border);
      border-radius: 6px;
      box-shadow: 0 1px 0 var(--shadow);
    }

    .file-header {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 40px;
      padding: 8px 16px;
      color: var(--fg-muted);
      background: var(--canvas-subtle);
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    }

    .file-header svg {
      flex: none;
      fill: currentColor;
    }

    .markdown-body {
      padding: 32px;
      word-wrap: break-word;
    }

    .markdown-body > :first-child { margin-top: 0 !important; }
    .markdown-body > :last-child { margin-bottom: 0 !important; }

    .markdown-body h1,
    .markdown-body h2,
    .markdown-body h3,
    .markdown-body h4,
    .markdown-body h5,
    .markdown-body h6 {
      margin-top: 24px;
      margin-bottom: 16px;
      font-weight: 600;
      line-height: 1.25;
    }

    .markdown-body h1 {
      margin: 0.67em 0;
      padding-bottom: 0.3em;
      border-bottom: 1px solid var(--border-muted);
      font-size: 2em;
    }

    .markdown-body h2 {
      padding-bottom: 0.3em;
      border-bottom: 1px solid var(--border-muted);
      font-size: 1.5em;
    }

    .markdown-body p {
      margin-top: 0;
      margin-bottom: 16px;
    }

    .markdown-body ul,
    .markdown-body ol {
      margin-top: 0;
      margin-bottom: 16px;
      padding-left: 2em;
    }

    .markdown-body li + li { margin-top: 0.25em; }

    .markdown-body a {
      color: var(--accent);
      text-decoration: none;
    }

    .markdown-body a:hover {
      color: var(--accent-hover);
      text-decoration: underline;
    }

    @media (max-width: 544px) {
      .markdown-body { padding: 16px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <article class="file">
      <header class="file-header">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M2 1.75C2 .784 2.784 0 3.75 0h6.586c.464 0 .909.184 1.237.513l2.914 2.914c.329.328.513.773.513 1.237v9.586A1.75 1.75 0 0 1 13.25 16h-9.5A1.75 1.75 0 0 1 2 14.25Zm1.75-.25a.25.25 0 0 0-.25.25v12.5c0 .138.112.25.25.25h9.5a.25.25 0 0 0 .25-.25V6h-2.75A1.75 1.75 0 0 1 9 4.25V1.5Zm6.75.062V4.25c0 .138.112.25.25.25h2.688l-.011-.013-2.914-2.914-.013-.011Z"/>
        </svg>
        index.md
      </header>
      <div class="markdown-body">
        <h1>Foryesify</h1>
        <p>这里存放我的一些杂七杂八的东西，以及我要阅读的文章</p>
        <ul>
          <li>Read: <a href="./Read/">读书</a></li>
          <li>Zhuci: <a href="./Zhuci/">朱慈</a></li>
          <li>ML: 机器学习</li>
          <li>ClassroomFucker: 一个恶作剧小程序</li>
          <li>AppList: 存放我的应用列表</li>
        </ul>
      </div>
    </article>
  </main>
</body>
</html>
